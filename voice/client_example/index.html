<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Voice bridge — minimal client</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #111;
        --muted: #666;
        --bg: #fafafa;
        --user: #0a5;
        --model: #246;
        --system: #888;
        --error: #c33;
      }
      html {
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        max-width: 820px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: var(--fg);
      }
      h1 {
        font-size: 1.2rem;
        margin-bottom: 0.25rem;
      }
      p.hint {
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 0;
      }
      #log {
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 0.75rem 1rem;
        height: 46vh;
        overflow-y: auto;
        background: var(--bg);
        font-size: 0.95rem;
        line-height: 1.45;
      }
      .line {
        margin: 0.35rem 0;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .line .who {
        font-weight: 600;
        margin-right: 0.5rem;
      }
      .user .who {
        color: var(--user);
      }
      .model .who {
        color: var(--model);
      }
      .system .who {
        color: var(--system);
      }
      .error .who {
        color: var(--error);
      }
      form {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
        align-items: center;
      }
      input {
        flex: 1;
        padding: 0.5rem 0.75rem;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      button {
        padding: 0.5rem 0.9rem;
        font-size: 0.95rem;
        border: none;
        border-radius: 6px;
        background: #111;
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: #eee;
        color: #111;
        border: 1px solid #ccc;
      }
      button.mic.on {
        background: #c33;
      }
      button:disabled {
        background: #888;
        cursor: not-allowed;
      }
      .controls {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .status {
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 0.5rem;
      }
      label.modality {
        font-size: 0.9rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>Voice bridge — minimal client</h1>
    <p class="hint">
      Text input always works. Mic captures 16 kHz PCM and streams it to the
      bridge; in AUDIO mode the model's reply is played back at 24 kHz.
    </p>

    <div id="log" aria-live="polite"></div>

    <form id="form">
      <input
        id="msg"
        type="text"
        placeholder="Ask something…"
        autocomplete="off"
        disabled
      />
      <button id="send" type="submit" disabled>Send</button>
    </form>

    <div class="controls">
      <button id="mic" class="mic secondary" disabled>🎙 Hold to talk</button>
      <label class="modality">
        Reply modality:
        <select id="modality">
          <option value="AUDIO" selected>AUDIO</option>
          <option value="TEXT">TEXT (requires a TEXT-capable live model)</option>
        </select>
      </label>
      <button id="reconnect" class="secondary">Reconnect</button>
    </div>

    <div class="status" id="status">idle</div>

    <script>
      const params = new URLSearchParams(location.search);
      const BRIDGE_URL = params.get("bridge") || "ws://localhost:8765";
      const DOCUMENT_ID = params.get("doc") || "echo_test";

      const logEl = document.getElementById("log");
      const statusEl = document.getElementById("status");
      const msgEl = document.getElementById("msg");
      const sendBtn = document.getElementById("send");
      const form = document.getElementById("form");
      const micBtn = document.getElementById("mic");
      const modalityEl = document.getElementById("modality");
      const reconnectBtn = document.getElementById("reconnect");

      let ws = null;
      let currentModelLine = null;
      let playbackCtx = null;
      let nextPlaybackAt = 0;
      let micCtx = null;
      let micWorklet = null;
      let micStream = null;
      let micOn = false;
      let resumeHandle = null;

      function addLine(role, text) {
        const row = document.createElement("div");
        row.className = `line ${role}`;
        const who = document.createElement("span");
        who.className = "who";
        who.textContent =
          role === "user"
            ? "you"
            : role === "model"
              ? "gemini"
              : role === "error"
                ? "error"
                : "sys";
        row.appendChild(who);
        row.appendChild(document.createTextNode(text));
        logEl.appendChild(row);
        logEl.scrollTop = logEl.scrollHeight;
        return row;
      }

      function setConnected(on) {
        msgEl.disabled = !on;
        sendBtn.disabled = !on;
        micBtn.disabled = !on;
        if (on) msgEl.focus();
      }

      function playPcm(buffer) {
        if (!playbackCtx) {
          playbackCtx = new AudioContext({ sampleRate: 24000 });
          nextPlaybackAt = 0;
        }
        const int16 = new Int16Array(buffer);
        const float32 = new Float32Array(int16.length);
        for (let i = 0; i < int16.length; i++) {
          float32[i] = int16[i] / 0x8000;
        }
        const audioBuf = playbackCtx.createBuffer(1, float32.length, 24000);
        audioBuf.copyToChannel(float32, 0);
        const src = playbackCtx.createBufferSource();
        src.buffer = audioBuf;
        src.connect(playbackCtx.destination);
        const startAt = Math.max(playbackCtx.currentTime, nextPlaybackAt);
        src.start(startAt);
        nextPlaybackAt = startAt + audioBuf.duration;
      }

      async function toggleMic(on) {
        if (on && !micOn) {
          try {
            micStream = await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: true,
                noiseSuppression: true,
                channelCount: 1,
              },
            });
            micCtx = new AudioContext();
            await micCtx.audioWorklet.addModule("./audio-worklet.js");
            micWorklet = new AudioWorkletNode(micCtx, "pcm-capture", {
              processorOptions: { targetRate: 16000 },
            });
            const src = micCtx.createMediaStreamSource(micStream);
            src.connect(micWorklet);
            micWorklet.port.onmessage = (ev) => {
              if (ws && ws.readyState === WebSocket.OPEN) ws.send(ev.data);
            };
            micOn = true;
            micBtn.classList.add("on");
            micBtn.textContent = "🔴 Release to stop";
            statusEl.textContent = "mic on";
          } catch (err) {
            addLine("error", `mic error: ${err.message}`);
          }
          return;
        }
        if (!on && micOn) {
          try {
            micWorklet?.port.close?.();
            micWorklet?.disconnect();
            micStream?.getTracks().forEach((t) => t.stop());
            await micCtx?.close();
          } catch {}
          micCtx = null;
          micWorklet = null;
          micStream = null;
          micOn = false;
          micBtn.classList.remove("on");
          micBtn.textContent = "🎙 Hold to talk";
          statusEl.textContent = "mic off";
          // Commit the turn so the model responds.
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "audio_end" }));
          }
        }
      }

      function connect() {
        if (ws && ws.readyState !== WebSocket.CLOSED) ws.close();
        statusEl.textContent = `connecting to ${BRIDGE_URL}…`;
        ws = new WebSocket(BRIDGE_URL);
        ws.binaryType = "arraybuffer";

        ws.addEventListener("open", () => {
          statusEl.textContent = `connected — awaiting ready`;
          const init = {
            document_id: DOCUMENT_ID,
            modality: modalityEl.value,
          };
          if (resumeHandle) init.resume_handle = resumeHandle;
          ws.send(JSON.stringify(init));
        });

        ws.addEventListener("message", (ev) => {
          if (typeof ev.data !== "string") {
            playPcm(ev.data);
            return;
          }
          let msg;
          try {
            msg = JSON.parse(ev.data);
          } catch {
            return;
          }
          switch (msg.type) {
            case "ready":
              statusEl.textContent = `ready (${DOCUMENT_ID}, ${modalityEl.value}${msg.resumed ? ", resumed" : ""})`;
              setConnected(true);
              break;
            case "go_away":
              addLine("system", `server will close soon (${msg.time_left || "?"}). reconnect will resume.`);
              break;
            case "resumption_handle":
              resumeHandle = msg.handle;
              break;
            case "text":
              if (!currentModelLine) currentModelLine = addLine("model", "");
              currentModelLine.appendChild(document.createTextNode(msg.text));
              logEl.scrollTop = logEl.scrollHeight;
              break;
            case "transcript":
              if (msg.role === "user") {
                addLine("system", `[heard you say] ${msg.text}`);
              } else {
                if (!currentModelLine)
                  currentModelLine = addLine("model", "");
                currentModelLine.appendChild(
                  document.createTextNode(msg.text),
                );
              }
              break;
            case "turn_complete":
              currentModelLine = null;
              break;
            case "interrupted":
              currentModelLine = null;
              nextPlaybackAt = 0;
              break;
            case "error":
              addLine("error", msg.message || "bridge error");
              break;
            default:
              break;
          }
        });

        ws.addEventListener("close", (ev) => {
          statusEl.textContent = `disconnected (${ev.code})`;
          setConnected(false);
          toggleMic(false);
        });
        ws.addEventListener("error", () => {
          statusEl.textContent = "websocket error";
        });
      }

      form.addEventListener("submit", (ev) => {
        ev.preventDefault();
        const text = msgEl.value.trim();
        if (!text) return;
        addLine("user", text);
        ws.send(JSON.stringify({ type: "text", text }));
        msgEl.value = "";
      });

      // Push-to-talk: pointerdown to start, pointerup/leave to stop.
      micBtn.addEventListener("pointerdown", (ev) => {
        ev.preventDefault();
        toggleMic(true);
      });
      for (const evt of ["pointerup", "pointerleave", "pointercancel"]) {
        micBtn.addEventListener(evt, (ev) => {
          ev.preventDefault();
          toggleMic(false);
        });
      }

      reconnectBtn.addEventListener("click", () => connect());

      connect();
    </script>
  </body>
</html>
